certifications_note: >-
  No named certification (SOC 2, ISO 27001, PCI DSS, HIPAA, FedRAMP) could be verified from a readable
  RocketReach page. trust.rocketreach.co exists but returns HTTP 403 behind a Cloudflare interstitial, and
  rocketreach.co/security returns 404. RocketReach does publish GDPR and CCPA pages
  (rocketreach.co/gdpr, rocketreach.co/ccpa, both HTTP 200) but those are policy statements, not attestations.
