      runtime-header: Retry-After
      global-ceiling: 10 requests per second across all RocketReach APIs
      detail: rate-limits/rocketreach-rate-limits.yml
    x-idempotency:
      supported: false
      note: No idempotency key is published. Retrying a credit-consuming lookup can spend a second credit.
