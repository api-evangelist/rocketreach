summary: >-
  RocketReach publishes a full per-plan rate-limit matrix broken out by API family (person search, person
  lookup, company search, bulk jobs) across minute, hourly, daily and monthly windows, plus a global ceiling
  of 10 requests per second across all APIs. Exhaustion returns HTTP 429 with a Retry-After header carrying
  the number of seconds to wait. MCP tool calls draw on the SAME budget — there is no separate MCP quota.
signalling:
  status_code: 429
  status_text: Too Many Requests
  response_headers:
  - name: Retry-After
    description: Seconds to wait before the endpoint becomes available again. Published and documented; clients are told to parse and honour it.
    verified: documented
  rate_limit_headers_published: false
  rate_limit_header_note: >-
    RocketReach does NOT document X-RateLimit-* or RFC 9331 RateLimit-* response headers. The only runtime
    signal on the wire is Retry-After on a 429. Current limits and usage are instead readable out-of-band
    from the account endpoint (GET /account/, GET /universal/account/) under rate_limits, and via the MCP
    account tool.
  mcp_error_shape:
    error_code: rate_limited
    meta_field: retry_after_seconds
    source: https://docs.rocketreach.co/reference/mcp-errors
global:
- scope: all-apis
  window: second
  limit: 10
  note: Global ceiling of 10 requests per second across every RocketReach API, in addition to the per-plan limits below.
