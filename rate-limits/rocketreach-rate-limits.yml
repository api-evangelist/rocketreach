remediation:
- Parse the Retry-After header on any 429 and sleep for that many seconds before retrying.
- Use webhooks for person lookups instead of polling checkStatus, to cut request volume.
- Call the account endpoint (or the MCP account tool) to read current limits and usage before a batch run.
- Upgrade the plan by contacting api@rocketreach.co; free accounts have no paid API allowance.
