aid: rocketreach
name: RocketReach
url: https://raw.githubusercontent.com/api-evangelist/rocketreach/refs/heads/main/apis.yml
description: RocketReach is a Seattle-based B2B contact data and sales intelligence provider that maintains a
  database of 700M+ professional profiles and 60M+ companies and exposes it through a REST API for email,
  phone, and social-handle discovery plus company firmographics. The platform is used for sales prospecting,
  recruiting, marketing enrichment, and CRM hydration, with results returned as structured profile and
  company objects and optional webhook delivery for asynchronous lookups.
