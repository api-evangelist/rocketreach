  - url: openapi/rocketreach-people-lookup-api-openapi.yml
    type: OpenAPI
  description: Look up an individual's email addresses, phone numbers, social handles, and full enriched
    profile from a name + employer, LinkedIn URL, RocketReach profile id, NPI number, or email. Supports
    single lookups, bulk lookups (up to 100 queries per request), status polling, combined person+company
    lookups, and the newer Universal endpoints. Results can be delivered synchronously or via webhook with
    an RR-Request-ID correlation header.
- aid: rocketreach:rocketreach-people-search-api
