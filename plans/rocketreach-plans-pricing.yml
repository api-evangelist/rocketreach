metering:
  model: credits
  systems:
  - name: Universal Credits
    description: >-
      Single credit pool spent across every action, live as of the 2026 rollout. Published costs — person
      search 1 credit per page of up to 100 results; company search 2 credits per page; professional email
      2 credits per verified profile; personal email 3 credits; phone 6 credits; detailed person enrichment
      1 credit; healthcare enrichment 1 credit; company enrichment 1 credit.
    source: https://docs.rocketreach.co/reference/universal-credits-overview
  - name: Legacy credit types
    description: >-
      Six discrete credit types still issued on legacy plans — standard_lookup, premium_lookup, phone_lookup,
      person_enrich, person_export, company_export. allocated 0 on the account endpoint means that credit
      type is not available on the plan.
    source: https://docs.rocketreach.co/reference/mcp-errors
  balance_endpoint: GET https://api.rocketreach.co/api/v2/universal/account/
  exhaustion_error: HTTP 402 / MCP error_code insufficient_credits with _meta.credit_type
