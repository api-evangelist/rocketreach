    source: https://docs.rocketreach.co/reference/people-lookup-api
  - change: >-
      api_key query-string authentication is deprecated in favour of the Api-Key request header. Older
      clients may still send it.
    effective: null
    breaking: false
    source: openapi/_original/rocketreach-api-openapi.json (securitySchemes.RocketReachAPIKey.description)
  - change: >-
      Universal Credits replaces the six discrete legacy credit types with a single pool, and adds a parallel
      /api/v2/universal/* operation for every legacy lookup and search operation. Legacy endpoints remain.
    effective: null
    breaking: false
    migration: https://docs.rocketreach.co/reference/universal-credits-overview
